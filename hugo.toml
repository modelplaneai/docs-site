baseURL = "/"
locale = "en-us"
title = "Modelplane Docs"
theme = "geekboot"
enableRobotsTXT = true
enableGitInfo = false

# Term pages power the recipe catalog facets; taxonomy (index-of-terms) pages
# stay disabled — the catalog page on /recipes/ fills that role.
disableKinds = ["taxonomy"]
# Keep term titles exactly as written in front matter ("vLLM", not "VLLM").
capitalizeListTitles = false
ignoreFiles = ["themes/geekboot/content/.*", "README.md"]

# Only vendors and clouds are taxonomies — their term pages are the browse
# targets on /recipes/. GPU, engine, and technique facets are plain front
# matter rendered inline; they get no term pages until something links there.
[taxonomies]
  vendor = "vendors"
  cloud  = "clouds"

# Nest term pages under the Recipes section so facet URLs read as part of the
# catalog: /recipes/cloud/nebius/ lists every recipe that runs on Nebius.
[permalinks]
  [permalinks.term]
    vendors = "/recipes/vendor/:slug/"
    clouds  = "/recipes/cloud/:slug/"

[outputs]
  home = ["html", "llms", "llmsfull", "llmsjson"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]
  term = ["html"]

# Machine-readable variants for AI agents and LLM tools. The markdown format
# emits a raw-Markdown sibling of every page (page/index.md); the home page also
# emits llms.txt (an index), llms-full.txt (every page concatenated), and
# llms.json (the corpus the docs MCP server searches). See content/ai-tools.md.
[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    permalinkable = true
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
  [outputFormats.llmsjson]
    mediaType = "application/json"
    baseName = "llms"
    isPlainText = true


[build]
  # Emit hugo_stats.json listing the tags, classes, and IDs the site uses.
  # PurgeCSS reads it to strip unused CSS rules. See postcss.config.js.
  [build.buildStats]
    enable = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9
  [markup.highlight]
    codeFences = true
    noClasses = false
    linenos = false
    anchorLineNos = false
    lineNumbersInTable = false

[module]
  # None of the prose is in this repo. build.sh clones the modelplane branch
  # each version tracks into modelplane/, and every mount below reads from
  # there, so one branch of this repo builds every version. To work against a
  # checkout locally:
  #   ln -s ~/src/modelplane modelplane && hugo server
  [[module.mounts]]
    source = "modelplane/docs/content"
    target = "content"
  [[module.mounts]]
    source = "modelplane/docs/content"
    target = "assets/content"
    files = ["**/**.png", "**/**.jpg", "**/**.jpeg", "**/**.gif"]
  # Defining any data mount suppresses Hugo's default one, so mount both
  # halves explicitly: the version list lives here (data/docversions.json), while
  # apigroups.yaml and recipes.yaml belong with the content. Mounts to the same
  # target merge, so both land in hugo.Data.
  [[module.mounts]]
    source = "data"
    target = "data"
  # Both halves land in hugo.Data, so a file here and a file there sharing a
  # basename would collide. Ours is docversions.json precisely because the
  # content repo still ships a stale data/versions.yaml - the old
  # per-subdomain list - and always will on release branches already cut.
  [[module.mounts]]
    source = "modelplane/docs/data"
    target = "data"
  # The CRDs the API reference is generated from, as Hugo data:
  # hugo.Data.apis.crds.<plural>.definition
  [[module.mounts]]
    source = "modelplane/apis"
    target = "data/apis/crds"
  # Also as assets, so the Markdown output can emit definition.yaml verbatim,
  # comments preserved, via resources.Get "apis/<plural>/definition.yaml".
  [[module.mounts]]
    source = "modelplane/apis"
    target = "assets/apis"
  # The example manifests the manifests shortcode embeds as raw YAML via
  # resources.Get "examples/<path>.yaml".
  [[module.mounts]]
    source = "modelplane/docs/manifests"
    target = "assets/examples"

[security]
  [security.node.permissions]
    # Hugo runs Node tools under Node's permission model, which blocks
    # native addons unless the tool is listed here. The PostCSS pipeline
    # needs it: LightningCSS is a native addon. "tailwindcss" is Hugo's
    # default; keep it when overriding the list.
    allowAddons = ["postcss", "tailwindcss"]

[params]
  docs = true
  description = "Modelplane documentation."
  # Which version this build is. build.sh sets all three per version from
  # data/versions.json; these are the defaults a bare `hugo server` uses.
  # version: "main", or "X.Y" for a release.  path: the URL prefix it is
  # served under.  branch: the modelplane branch it was built from, used by
  # the "view page source" and manifest links.
  version = "main"
  path = "main"
  branch = "main"
  [params.anchors]
    min = 2
    max = 5

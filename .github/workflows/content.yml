name: Update content

# Bump every version's content pin to the tip of the branch it tracks: the
# modelplane submodule for main, and the rev/hash in data/versions.json for
# each archived version.
# Merging the resulting commit is what ships new prose - this repo pins content
# commits, so content changes are invisible to the site until the pins move.
#
# This is why archived docs need no release branch here and no backport: a fix
# landed on the content repo's release-0.3 reaches the site through this job,
# the same way a fix on main does.
#
# Runs daily and on demand. The content repo can also trigger it right after a
# merge:
#   gh workflow run content.yml --repo modelplaneai/docs-site
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump every content pin
        id: bump
        run: |
          git submodule update --remote modelplane

          # Every archived version records the branch it tracks plus the rev
          # and hash it is pinned at, so this job reads the version list rather
          # than being edited when a release is added. An entry with a branch
          # but no rev - what you get from adding a release by hand - is filled
          # in here on the next run.
          repo=$(jq -r .repo data/versions.json)
          for branch in $(jq -r '.versions[] | select(.branch) | .branch' data/versions.json); do
            rev=$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" | cut -f1)
            [ -n "$rev" ] || { echo "no such branch: $branch" >&2; exit 1; }
            hash=$(nix hash convert --hash-algo sha256 --to sri "$(
              nix-prefetch-url --unpack --type sha256 \
                "https://github.com/$repo/archive/$rev.tar.gz" | tail -1)")
            jq --arg b "$branch" --arg r "$rev" --arg h "$hash" \
              '(.versions[] | select(.branch == $b)) |= (.rev = $r | .hash = $h)' \
              data/versions.json > versions.tmp
            mv versions.tmp data/versions.json
          done

          if git diff --quiet -- modelplane data/versions.json; then
            echo "Every version is already at the tip of its branch."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C modelplane rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A PR rather than a push to main, so the site build runs against the new
      # content before it deploys.
      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content-update
          title: "Update docs content to ${{ steps.bump.outputs.sha }}"
          body: >-
            Moves main's content to ${{ steps.bump.outputs.sha }} and every
            archived version to the tip of its release branch. CI builds all of
            them against these pins.
          commit-message: "Update docs content to ${{ steps.bump.outputs.sha }}"

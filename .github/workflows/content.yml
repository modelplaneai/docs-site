name: Content

# Deploys on behalf of the content repo, which owns the prose but knows nothing
# about Hugo or Vercel. It dispatches here on a docs pull request and on a docs
# merge, and this workflow is the only thing that talks to Vercel:
#
#   content-preview    build one revision of the content, as a preview
#   content-published  rebuild every version and promote it to production
#
# Nothing here writes back to the content repo. A preview is aliased to a
# hostname derived from the pull request number, which that repo can post
# itself the moment it dispatches, before this build finishes.
#
# The deployment is built on Vercel rather than here, so the project's own
# vercel.json applies - the /mcp function and the per-version rewrites included.
# CONTENT_REF is passed as a build environment variable and read by build.sh.
on:
  repository_dispatch:
    types: [content-preview, content-published]
  # A change here publishes itself: a new version in docversions.json, a theme
  # fix, a layout change. There is no content revision to dispatch for those,
  # and every one of them changes what the published site looks like.
  push:
    branches: [main]
  # By hand: pass a revision and a pull request number to rerun a preview, or
  # run it with neither to publish. A version bump here - a new entry in
  # docversions.json - has no content change to dispatch, so this is how it
  # reaches production.
  workflow_dispatch:
    inputs:
      ref:
        description: Content revision to preview (branch, or a full 40-character sha)
        type: string
      pr:
        description: Content pull request number. Leave empty to deploy production.
        type: string

permissions:
  contents: read

# One deployment per pull request at a time; a new push supersedes the build
# still running for the old one.
concurrency:
  group: content-${{ github.event.client_payload.pr || inputs.pr || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONTENT_REF: ${{ github.event.client_payload.ref || inputs.ref }}
      PR: ${{ github.event.client_payload.pr || inputs.pr }}

    steps:
      - uses: actions/checkout@v4

      # A preview of one revision, aliased to the hostname the content repo
      # already posted. --build-env reaches build.sh's step 4a.
      # A pull request number means a preview; its absence means production.
      # content-preview always carries one and content-published never does, so
      # this covers the dispatches and a manual run alike.
      - name: Deploy preview
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Vercel titles a deployment, and credits an author, from these
          # reserved github* meta keys. Left unset, the CLI describes the
          # checkout it is run from, so every preview in the dashboard reads as
          # this repo's last push by whoever made it, and nothing says which
          # content revision it is. The commit under review is in another repo,
          # so it has to be looked up and handed over.
          repo=$(jq -r .repo themes/geekboot/data/docversions.json)
          # Out of the checkout: the CLI uploads it, and this is not site source.
          commit="$RUNNER_TEMP/commit.json"
          gh api "repos/$repo/commits/$CONTENT_REF" > "$commit"
          message=$(jq -r '.commit.message | split("\n")[0]' "$commit")
          author=$(jq -r '.commit.author.name' "$commit")
          login=$(jq -r '.author.login // ""' "$commit")
          url=$(npx --yes vercel@latest deploy --token="$VERCEL_TOKEN" \
            --build-env "CONTENT_REF=$CONTENT_REF" \
            --meta "contentRef=$CONTENT_REF" --meta "contentPr=$PR" \
            --meta "githubOrg=${repo%/*}" --meta "githubRepo=${repo#*/}" \
            --meta "githubCommitOrg=${repo%/*}" --meta "githubCommitRepo=${repo#*/}" \
            --meta "githubCommitSha=$CONTENT_REF" \
            --meta "githubCommitRef=refs/pull/$PR/head" \
            --meta "githubCommitMessage=$message" \
            --meta "githubCommitAuthorName=$author" \
            --meta "githubCommitAuthorLogin=$login")
          echo "Deployed $url"
          # Aliased through the API rather than "vercel alias", which loads the
          # token's own user account before anything else - a team-scoped token
          # cannot, and the CLI fails with a 404 after a successful deploy.
          curl -fsS -X POST \
            "https://api.vercel.com/v2/deployments/${url#https://}/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"modelplane-docs-pr-${PR}.vercel.app\"}"

      # Production reads the tip of every branch in the version list, so a
      # merge in the content repo publishes by rebuilding, with no revision
      # pinned anywhere.
      - name: Deploy production
        if: env.PR == ''
        run: npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN"

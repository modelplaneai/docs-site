name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Cancel superseded runs for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # build.sh is the buildCommand Vercel runs, so this is the deploy
      # rehearsed rather than a separate approximation of it. It clones the
      # content branches itself; nothing else to check out.
      - name: Build every version
        run: bash build.sh

      # Internal links only (CheckExternal is false), so no network and no
      # flaking on someone else's downtime. The build above is root-relative
      # outside production, which is what htmltest can resolve.
      - name: Check internal links
        run: |
          curl -fsSL https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz \
            | tar -xz htmltest
          PATH="$PWD:$PATH" utils/htmltest/check.sh
